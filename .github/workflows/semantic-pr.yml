# Fails a PR whose title isn't a Conventional Commit (feat:, fix:, docs:, …). PRs are squash-merged, so
# the title becomes the commit on main, which release-please reads to pick the next version.
#
# Caller (in the app repo), as a required check:
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#   jobs:
#     title:
#       uses: kthaisociety/workflows/.github/workflows/semantic-pr.yml@<tag>
#       permissions:
#         pull-requests: read
name: semantic-pr

on:
  workflow_call:

permissions: {}

jobs:
  title:
    name: PR title is a Conventional Commit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # A one-commit PR is squash-merged with that commit's message by default, not the title.
          validateSingleCommit: true
