# Builds the repo's image and pushes it to GHCR as ghcr.io/<owner>/<repo>:sha-<7-char commit>. The digest
# is an output: deploys pin it, and release.yml adds the version tag to it later without rebuilding.
#
# Caller (in the app repo), on every push to main:
#   on:
#     push:
#       branches: [main]
#   jobs:
#     build:
#       uses: kthaisociety/workflows/.github/workflows/build.yml@<tag>
#       permissions:
#         contents: read
#         packages: write
#
# Run the app's tests in the caller first (a job this one `needs`), so a failing commit is never built.
name: build

on:
  workflow_call:
    inputs:
      context:
        description: Build context, relative to the repo root.
        type: string
        default: .
      dockerfile:
        description: Dockerfile path, relative to the repo root.
        type: string
        default: Dockerfile
      platforms:
        description: Target platforms. The Dokploy host is amd64.
        type: string
        default: linux/amd64
    outputs:
      image:
        description: Image name, without tag (ghcr.io/<owner>/<repo>).
        value: ${{ jobs.build.outputs.image }}
      tag:
        description: The tag pushed, sha-<7-char commit>.
        value: ${{ jobs.build.outputs.tag }}
      digest:
        description: The pushed image's digest (sha256:…).
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      tag: ${{ steps.name.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and tag
        id: name
        run: |
          # GHCR image names must be lowercase.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
          # source links the package to this repo, so it inherits the repo's access (private stays private).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          REF: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}@${{ steps.push.outputs.digest }}
        run: echo "Pushed \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
